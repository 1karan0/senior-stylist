import java.util.Properties
import java.io.FileInputStream

// Copy the correct google-services.json file based on build flavor
// This must happen BEFORE the Google Services plugin is applied
def getCurrentFlavor() {
    def gradle = getGradle()
    def tskReqStr = gradle.getStartParameter().getTaskRequests().toString()

    if (tskReqStr.contains("Dev") || tskReqStr.contains("dev")) {
        return "dev"
    } else if (tskReqStr.contains("Prod") || tskReqStr.contains("prod")) {
        return "prod"
    } else if (tskReqStr.contains("installDebug") || tskReqStr.contains("assembleDebug")) {
        // Local RN debug workflows usually target dev flavor via installDebug alias.
        return "dev"
    }
    // Keep production as fallback for explicit release tasks and CI.
    return "prod"
}

def currentFlavor = getCurrentFlavor()
def flavorGoogleServicesSource = file("google-services-${currentFlavor}.json")
def legacyGoogleServicesSource = file("src/${currentFlavor}/google-services.json")
def googleServicesSource = flavorGoogleServicesSource.exists() ? flavorGoogleServicesSource : legacyGoogleServicesSource
def googleServicesTarget = file("google-services.json")

if (googleServicesSource.exists()) {
    googleServicesTarget.delete()
    googleServicesTarget << googleServicesSource.text
    println "✓ Copied google-services.json from ${googleServicesSource.path} for ${currentFlavor} build"
} else {
    println "WARNING: google-services config not found for flavor '${currentFlavor}'. Expected one of:"
    println "  - ${flavorGoogleServicesSource.path}"
    println "  - ${legacyGoogleServicesSource.path}"
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Configure react-native-config to use different .env files per flavor
project.ext.envConfigFiles = [
    dev: ".env.dev",
    prod: ".env.prod"
]

// Apply react-native-config to load environment variables from .env files
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// Load keystore properties for release signing
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.senior_stylist"
    defaultConfig {
        applicationId "com.seniorstylist.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 45
        versionName "1.4.0"
        missingDimensionStrategy "environment", "prod"
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.seniorstylist.app.dev"
            resValue "string", "build_config_package", "com.senior_stylist"
        }
        prod {
            dimension "environment"
            applicationId "com.seniorstylist.app"
            resValue "string", "build_config_package", "com.senior_stylist"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signing with release keystore for Google Play
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                println "WARNING: keystore.properties not found. Release builds will not be signed properly."
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation(platform("com.google.firebase:firebase-bom:34.12.0"))
    implementation("com.google.firebase:firebase-auth")



      // ===== BILLING LIBRARY 8.x (Latest as of 2025) =====
    implementation "com.android.billingclient:billing:8.0.0"
    implementation "com.android.billingclient:billing-ktx:8.0.0"
    
    // Required AndroidX dependencies
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Alias installDebug to installDevDebug for React Native CLI compatibility
tasks.register('installDebug') {
    dependsOn 'installDevDebug'
}
